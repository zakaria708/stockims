<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockIMS - Mouvements</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/navigation :: sidebar('mouvements')}"></aside>

  <main class="main">
    <header class="topbar">
      <div class="title-row">
        <button class="btn btn-light mobile-menu" type="button" data-menu-toggle>☰</button>
        <div><h1>Historique des mouvements</h1><p class="subtitle">Suivez toutes les entrées et sorties de stock.</p></div>
      </div>
    </header>

    <section class="card toolbar-card">
      <form class="filters filters-compact" th:action="@{/mouvements}" method="get">
        <div class="field search-field">
          <label for="q">Article</label>
          <input id="q" name="q" th:value="${q}" placeholder="Référence ou désignation...">
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="TOUS" th:selected="${type == 'TOUS'}">Tous</option>
            <option value="ENTREE" th:selected="${type == 'ENTREE'}">Entrées</option>
            <option value="SORTIE" th:selected="${type == 'SORTIE'}">Sorties</option>
          </select>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" type="submit">Filtrer</button>
          <a class="btn btn-light" th:href="@{/mouvements}">Réinitialiser</a>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <div><h2 class="card-title">Mouvements enregistrés</h2><p class="subtitle" th:text="${#lists.size(mouvements)} + ' mouvement(s)'">0 mouvement</p></div>
      </div>
      <div class="table-wrap" th:if="${!#lists.isEmpty(mouvements)}">
        <table>
          <thead><tr><th>Date</th><th>Référence</th><th>Désignation</th><th>Type</th><th>Quantité</th><th>Article</th></tr></thead>
          <tbody>
          <tr th:each="m : ${mouvements}">
            <td th:text="${#temporals.format(m.date, 'dd/MM/yyyy')}">24/10/2026</td>
            <td><strong th:text="${m.reference}">REF-001</strong></td>
            <td th:text="${m.designation}">Article</td>
            <td><span class="badge" th:classappend="${m.type == 'ENTREE'} ? ' badge-ok' : ' badge-empty'"
                      th:text="${m.type == 'ENTREE'} ? 'Entrée' : 'Sortie'">Entrée</span></td>
            <td><strong th:text="${(m.type == 'ENTREE' ? '+' : '-') + m.quantite}">+10</strong></td>
            <td><a class="link" th:href="@{/stock/{id}(id=${m.articleId})}">Ouvrir →</a></td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="empty-state" th:if="${#lists.isEmpty(mouvements)}">
        <strong>Aucun mouvement trouvé</strong>
        Aucun résultat ne correspond à ces critères.
      </div>
    </section>
  </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
